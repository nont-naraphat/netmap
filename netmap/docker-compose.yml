services:
  netmap:
    build: .
    container_name: netmap
    restart: unless-stopped
    ports:
      - "8700:8000"
    environment:
      # Set these in Portainer -> Stack -> Environment variables (or a stack.env
      # in the repo). For LIVE data set COLLECTOR=mcp and MCP_TOKEN=<token>.
      COLLECTOR: "${COLLECTOR:-mock}"
      POLL_SECONDS: "${POLL_SECONDS:-30}"
      MCP_URL: "${MCP_URL:-https://mcp.21sunpassion.com/mcp}"
      MCP_TOKEN: "${MCP_TOKEN:-}"
      MCP_TOOL_PREFIX: "${MCP_TOOL_PREFIX:-}"
